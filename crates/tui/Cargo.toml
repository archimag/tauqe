[package]
name = "tauqe-tui"
default-run = "tauqe"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "tauqe"
path = "src/main.rs"

[dependencies]
tauqe-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
ratatui.workspace = true
crossterm.workspace = true
tokio.workspace = true
anyhow.workspace = true
pulldown-cmark.workspace = true
syntect.workspace = true
similar.workspace = true
arboard.workspace = true
unicode-width.workspace = true
toml.workspace = true
toml_edit.workspace = true
# Standard Base64 for the OSC 52 clipboard payload. Only `crates/tui` consumes
# it, so it stays in this manifest and reuses the version the build graph
# already resolves (Conventions §1.6, §12.3).
base64 = "0.22"
# Shared with `crates/server`, so the workspace entry carries the version and
# the feature set (Conventions §12.3).
time.workspace = true
