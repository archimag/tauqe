[package]
name = "tauqe-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Exposes the scripted `MockLlmProvider` test double to downstream crates
# that need it in their own integration and unit tests.
test-support = []

[dependencies]
tauqe-protocol.workspace = true
tauqe-tools.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
futures-util.workspace = true
toml.workspace = true
tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true
async-trait.workspace = true
getrandom.workspace = true
uuid.workspace = true
regex.workspace = true
indexmap.workspace = true
struson.workspace = true
unicode-width.workspace = true

[dev-dependencies]
# Depend on this crate's own feature so integration tests under `tests/`
# (compiled as separate crates) can still reach `MockLlmProvider`.
tauqe-core = { path = ".", features = ["test-support"] }
tempfile.workspace = true
wiremock.workspace = true
# Log-capture assertions in unit tests install a test subscriber through the
# `fmt` layer; production code keeps logging through the plain facade only.
tracing-subscriber.workspace = true
