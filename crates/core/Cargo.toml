[package]
name = "tauqe-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Exposes the scripted `MockLlmProvider` test double to downstream crates
# that need it in their own integration and unit tests.
test-support = []

[dependencies]
tauqe-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
futures-util.workspace = true
toml.workspace = true
tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true
async-trait = "0.1"
getrandom = "0.2"
regex.workspace = true
indexmap.workspace = true
struson = { version = "0.5", features = ["serde"] }
tree-sitter = "0.22"
tree-sitter-rust = "0.21"
unicode-width = "0.1"

[dev-dependencies]
# Depend on this crate's own feature so integration tests under `tests/`
# (compiled as separate crates) can still reach `MockLlmProvider`.
tauqe-core = { path = ".", features = ["test-support"] }
tempfile = "3"
wiremock = "0.6"
