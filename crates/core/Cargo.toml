[package]
name = "tauqe-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Exposes the scripted `MockLlmProvider` test double to downstream crates
# that need it in their own integration and unit tests.
test-support = []

[dependencies]
tauqe-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
futures-util.workspace = true
toml.workspace = true
tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true
async-trait.workspace = true
getrandom.workspace = true
uuid.workspace = true
regex.workspace = true
indexmap.workspace = true
struson.workspace = true
tree-sitter = "0.22"
# Official grammars from the tree-sitter organization, pinned to the release
# wave that shares the tree-sitter 0.22 ABI. Every grammar therefore yields the
# same `tree_sitter::Language` type for the repo map symbol extractor.
tree-sitter-c = "0.21"
tree-sitter-c-sharp = "0.21"
tree-sitter-cpp = "0.22"
tree-sitter-go = "0.21"
tree-sitter-java = "0.21"
tree-sitter-javascript = "0.21"
tree-sitter-php = "0.22"
tree-sitter-python = "0.21"
tree-sitter-rust = "0.21"
tree-sitter-typescript = "0.21"
unicode-width.workspace = true

[dev-dependencies]
# Depend on this crate's own feature so integration tests under `tests/`
# (compiled as separate crates) can still reach `MockLlmProvider`.
tauqe-core = { path = ".", features = ["test-support"] }
tempfile.workspace = true
wiremock.workspace = true
# Log-capture assertions in unit tests install a test subscriber through the
# `fmt` layer; production code keeps logging through the plain facade only.
tracing-subscriber.workspace = true
