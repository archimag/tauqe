[package]
name = "tauqe-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
tauqe-protocol.workspace = true
tauqe-flow.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
time.workspace = true
anyhow.workspace = true
async-trait.workspace = true
futures-util.workspace = true
[dev-dependencies]
tauqe-flow = { workspace = true, features = ["test-support"] }
# Enables `MockLlmProvider` for handler unit tests without leaking the test
# double into the release daemon binary.
tauqe-core = { workspace = true, features = ["test-support"] }

# Compare actual TUI projections with core without coupling their runtime crates.
tauqe-tui = { path = "../tui" }
