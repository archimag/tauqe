[package]
name = "tauqe-tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
tauqe-protocol.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
# Tree-sitter and its grammars are single-consumer entries: they serve the
# repository map extractor this crate owns, so they are declared here instead
# of the workspace manifest. Every grammar is pinned to the release wave that
# shares the tree-sitter 0.22 ABI, so each one yields the same
# `tree_sitter::Language` type.
tree-sitter = "0.22"
tree-sitter-c = "0.21"
tree-sitter-c-sharp = "0.21"
tree-sitter-cpp = "0.22"
tree-sitter-go = "0.21"
tree-sitter-java = "0.21"
tree-sitter-javascript = "0.21"
tree-sitter-php = "0.22"
tree-sitter-python = "0.21"
tree-sitter-rust = "0.21"
tree-sitter-typescript = "0.21"

# `is_process_alive` performs the POSIX zero-signal probe, so `libc` is only
# linked on Unix: on every other target the probe conservatively reports
# each writer alive and needs no process introspection.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true