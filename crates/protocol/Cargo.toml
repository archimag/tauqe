[package]
name = "tauqe-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
serde.workspace = true
# `preserve_order` keeps JSON object keys in insertion order (IndexMap instead
# of BTreeMap). The strict discussion schema depends on it: `message` must stay
# the first property so language models stream the conversational answer before
# the structural fields. The feature is workspace-global through Cargo feature
# unification, so enabling it here also affects every other crate.
serde_json = { workspace = true, features = ["preserve_order"] }
