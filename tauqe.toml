# Project configuration.
#
# This document is the base layer of the project configuration. Every
# `tauqe.d/*.toml` file of the repository is merged into it in lexical
# file-name order: tables merge recursively, arrays of tables (`[[outer_docs]]`,
# `[[review.presets]]`) concatenate, and a key two files both declare as a value
# is a configuration error naming both of them. The module directory always
# belongs to the repository root, even when `--config` names another base
# document, so a split configuration travels with the project.
#
# The provider catalog is the single source of truth for the models this project
# exposes and for the names they are displayed under. An entry is either a bare
# model string or a `{ model = "...", alias = "..." }` table; the alias describes
# the model itself, so the picker, the headers, and the role summaries all resolve
# a display name from this one declaration:
#   { model = "~google/gemini-flash-latest", alias = "Gemini Flash" }
[providers.openrouter]
models = [
  { model = "google/gemini-3.8-flash", alias = "Gemini Flash" },
  { model = "~anthropic/claude-sonnet-latest", alias = "Claude Sonnet" },
  { model = "~anthropic/claude-haiku-latest", alias = "Claude Haiku" },
  { model = "~deepseek/deepseek-flash-latest", alias = "DeepSeek Flash" },
  { model = "tencent/hy4", alias = "Hy4" },
  { model = "~z-ai/glm-latest", alias = "GLM"  },
  { model = "meta/muse-spark-1.3-contributor", alias = "Muse Spark"}
]

[models]
scribe = "Claude Haiku"

repl = [
  "DeepSeek Flash",
  "Hy4",
  "GLM",
  "Gemini Flash",
]

coder = [
  { model = "DeepSeek Flash", attempts = 2 },
  { model = "GLM", attempts = 2 },
  { model = "Gemini Flash", level_up = false },
  { model = "Claude Sonnet", level_up = false }
]

architect = [
  "GLM",
  { model = "Gemini Flash", level_up = false }
]

reviewer = [
  "GLM",
  "Claude Sonnet",
]

auto_level_up = true
[repl]
max_retries = 20
use_control_loops = true

[project]
runner = "just"

[project.boundaries]
#protected = ["Justfile", "docs/specs/**", "tauqe.d/**"]

[git]
# upstream = "origin/master"  # base upstream branch for calculating diffs (auto-detected by default)
# bypass_hooks = true         # pass --no-verify so Tauqe commits skip project pre-commit/commit-msg hooks (default: true)

[history]
budget_tokens = 20000  # session history token budget before compaction is triggered (default: 20000)
# tail_turns = 10        # number of recent turns kept uncompressed in original form (default: 10)

[context]
max_research_rounds = 12  # maximum rounds for autonomous context research
token_budget = 1000000  # aggregate context token budget: repository files and external documents (default: 300000)
repomap_token_budget = 40000  # token budget for the repository map (default: 4000)
include_repo_map = true  # include the Tree-sitter repository map in turn prompts (default: true, false for on-demand)
pinned = [
    "Conventions.md",
    "Vision.md",
    "docs/src/SUMMARY.md"
]
