# The provider catalog is the single source of truth for the models this project
# exposes and for the names they are displayed under. An entry is either a bare
# model string or a `{ model = "...", alias = "..." }` table; the alias describes
# the model itself, so the picker, the headers, and the role summaries all resolve
# a display name from this one declaration:
#   { model = "~google/gemini-flash-latest", alias = "Gemini Flash" }
[providers.openrouter]
models = [
  { model = "~google/gemini-flash-latest", alias = "Gemini Flash" },
  { model = "google/gemini-4-argon", alias = "Gemini Argon" },
  { model = "~openai/gpt-luna-latest", alias = "GPT Luna" },
  { model = "~openai/gpt-sol-latest", alias = "GPT Sol" },
  { model = "~anthropic/claude-opus-latest", alias = "Claude Opus" },
  { model = "~anthropic/claude-sonnet-latest", alias = "Claude Sonnet" },
  { model = "~anthropic/claude-haiku-latest", alias = "Claude Haiku" },
  { model = "~deepseek/deepseek-flash-latest", alias = "DeepSeek Flash" },
  { model = "~z-ai/glm-latest", alias = "GLM"  },
  { model = "~z-ai/glm-flash-latest", alias = "GLM Flash" }
]

[models]
# Semantic model roles: specialized domain roles instead of generic difficulty tiers.
# `primary` is mandatory and must list at least one model; its first entry is the
# active model in the idle state and the deterministic default for the other roles.
# If coder, architect or reviewer are omitted, they inherit the entire primary list.
# `scribe` is a single utility model and defaults to the first primary model.
# Every entry names a model either by its provider identifier ("~provider/model")
# or by an alias registered in `[providers.openrouter].models`, and carries the
# runtime parameters of that slot: an optional `effort` ("low", "medium", "high",
# "xhigh", "max"). A display alias is not a role field — it describes the model
# itself and lives in the catalog entry, so the same model is never labelled in
# two places.
primary = [
  { model = "GLM", effort = "high" },
  "Gemini Flash"
]
scribe = "Claude Haiku"    # history compaction, git squash commit messages, diff summarization
# The coder list is the natural escalation ladder (level up): on verification
# healing stalls or exhausted retries the turn advances to the next coder entry,
# saturating on the last one. Escalation stays strictly within the Coder role and
# never switches to Architect, preserving the What vs How role isolation.
coder = [
  "DeepSeek Flash",
  { model = "GLM", effort = "high" }
]
architect = [
  "GLM"
]
# conceptual design, plan refinement, blocked-step replanning
reviewer = [
  "GLM",
  "Gemini Argon",
  "Claude Sonnet",
  "Claude Opus"
]   # automated code review of active context files

# Automatically escalate the Coder along its ladder when verification healing stalls,
# when a patch retry budget is exceeded, or when a plan step must be re-prompted after
# protocol drift. Escalation advances one rung at a time within the Coder role and never
# switches to Architect, preserving the strict What vs How role isolation. A terminal
# <blocked> report short-circuits escalation entirely.
auto_level_up = true

[develop]
# Retry budget for failed edit staging, for the verification healing loop, and for the
# plan step reprompt loop (corrective re-runs of a step turn that produced no verified
# edits and no terminal success tag).
max_retries = 5
# Maximum automated replanning cycles triggered by a blocked coder step before
# requiring manual developer intervention (default: 2).
# max_replans = 2
# How a change set addresses the lines it replaces. `search_replace` (default)
# echoes the replaced text and matches it exactly; `line_anchor` names an
# inclusive line range through the compact opaque anchors rendered beside every
# context line, so the model copies a short token instead of reproducing the
# text it replaces. The strategy is orthogonal to `protocol`: the protocol picks
# the encoding of an edit, the strategy picks the fields that address a range.
patch_strategy = "line_anchor"
# Prompt layout policy. `semantic` composes the prompt as blocks grouped by kind
# (contract, repository map, context, plan, language, history, scratchpad), while
# `chronological` interleaves context files with history entries in the order they
# were added, so the prompt grows append-only from one turn to the next. When the
# key is absent the layout follows the turn intent: interactive REPL turns use
# `chronological`, isolated steps and discussions use `semantic`.
# prompt_layout = "chronological"
# workflow = "git"   # edit workflow: "git", "naive" (default: "git")
# Active edit protocol. `structured` is the default and drives strict JSON-Schema
# structured output, `xml` drives marker-protected XML tags, and `mixed` (legacy
# alias `auto`) pairs both contours: XML for code edits, structured output for
# discussions, commit messages, and history compaction. The format changes only the
# transport, the token cost and the prefix caching — the capabilities of a turn
# follow from its intent.
# protocol = "structured"

[project]
# The `[project]` section is the single surface that declares what the harness may run
# for this repository. Every entry is a plain command line executed as a process with
# literal arguments — never through a shell — so a project command cannot widen into
# arbitrary command execution. An entry may reuse a declared command by writing
# `@<name>` as its executable. A reference names the command that runs, so it
# carries no `args`, `description`, or `parameters` of its own; `timeout_secs` is
# the exception, because it bounds one invocation instead of defining the command
# line. The outermost declared budget wins along a reference chain, and a reference
# that declares none inherits the budget of the command it names.
#
# A declared task runner (`runner = "just"`) delegates the project lifecycle to the
# recipes carrying `[group('tauqe')]` in `Justfile`: `verify` fills the mandatory
# verification gate, `format` fills the in-memory format filter, `post-hook` fills the
# disk-side hook, and every other exported recipe becomes a typed custom tool. The
# technology-specific command lines therefore live in `Justfile`, while this file keeps
# only the harness policies. This repository declares the runner alone.
#
# A declaration in this section always takes precedence over the runner, so a stage may
# be pinned here without touching the runner. Each entry is a plain command line with
# literal arguments, and `verify` stays mandatory: a change set the harness cannot
# verify is never accepted.
#
# [project.verify]
# command = "cargo"
# args = ["test", "--workspace"]
# timeout_secs = 600
#
# # In-memory formatter: staged content arrives on standard input and the rewritten
# # content leaves on standard output, so the change set is formatted while it still
# # lives in staging and no unformatted byte ever reaches disk.
# [project.format]
# command = "rustfmt"
# args = ["--emit", "stdout"]
# timeout_secs = 120
#
# # Disk post-hook: runs strictly after the change set is written and before `verify`,
# # so generated sources and refreshed manifests exist when verification runs. Artifacts
# # it creates are captured through Git and join the same atomic commit.
# [project.post_hook]
# command = "cargo"
# args = ["generate-lockfile"]
#
# # Named project command, published to the model as a typed custom tool.
# [project.commands.check]
# command = "cargo"
# args = ["check", "--all-targets"]
# timeout_secs = 600
runner = "just"

[git]
# upstream = "origin/master"  # base upstream branch for calculating diffs (auto-detected by default)
# bypass_hooks = true         # pass --no-verify so Tauqe commits skip project pre-commit/commit-msg hooks (default: true)

[history]
budget_tokens = 20000  # session history token budget before compaction is triggered (default: 20000)
# tail_turns = 10        # number of recent turns kept uncompressed in original form (default: 10)

[context]
max_discovery_rounds = 8  # maximum rounds for autonomous context discovery
files_token_budget = 500000  # token budget for files in active context (default: 300000)
repomap_token_budget = 40000  # token budget for the repository map (default: 4000)
include_repo_map = true  # include the Tree-sitter repository map in turn prompts (default: true, false for on-demand)
# max_pattern_batch = 150  # maximum files added per glob pattern request (default: 150)
# max_search_requests_per_round = 5    # repository search queries honored per Discovery round (default: 5)
# max_matched_files_per_search = 50    # matching files reported for one search query (default: 50)
# max_dir_list_entries = 100           # entries rendered by one directory listing (default: 100)
# max_repo_map_requests_per_round = 3  # targeted repository maps rendered per Discovery round (default: 3)
# max_feedback_chars = 4000            # characters of one project command stream reported back to the model (default: 4000)
# max_scratchpad_chars = 4000          # characters of a turn scratchpad block kept before truncation (default: 4000)
pinned = [
    "Conventions.md",
    "Vision.md",
    "docs/src/SUMMARY.md"
]
