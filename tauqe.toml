[providers.openrouter]
models = [
  "~google/gemini-flash-latest",
  "~openai/gpt-luna-latest",
  "~openai/gpt-sol-latest",
  "~anthropic/claude-opus-latest",
  "~anthropic/claude-sonnet-latest",
  "~anthropic/claude-haiku-latest"
]

[models]
junior = "~anthropic/claude-haiku-latest"
middle = "~google/gemini-flash-latest"
senior = "~anthropic/claude-sonnet-latest"
default = "middle"
auto_level_up = true

[develop]
max_retries = 5  # maximum retry attempts for failed edit staging
# workflow = "git"   # edit workflow: "toolchain", "git", "naive" (default: "git")
# protocol = "xml"   # active edit protocol: "xml" (default: "xml")

[toolchain]
# check_command = ""  # custom project verification command (auto-detected by default)
# max_retries = 5     # maximum retry attempts for compiler/linter self-healing
# auto_heal = false   # automatically trigger verification healing loop on check failures

[git]
# upstream = "origin/master"  # base upstream branch for calculating diffs (auto-detected by default)

[history]
budget_tokens = 20000  # session history token budget before compaction is triggered (default: 20000)
# tail_turns = 10        # number of recent turns kept uncompressed in original form (default: 10)

[context]
# discovery_mode = "monotonic"  # context discovery strategy: "monotonic" (pure append-only growth, default), "incremental" (additive with explicit drops), or "snapshot" (full active working set declared each round)
max_discovery_rounds = 8  # maximum rounds for autonomous context discovery
max_files = 30  # maximum total files in context before stopping execution (default: 25)
# repomap_token_budget = 4000  # token budget for the repository map (default: 4000)
pinned = [
    "Conventions.md",
    "Vision.md",
    "book/src/SUMMARY.md"
]
