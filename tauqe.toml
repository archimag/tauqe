[providers.openrouter]
models = [
  "~google/gemini-flash-latest",
  "~google/gemini-pro-latest",
  "~openai/gpt-luna-latest",
  "~openai/gpt-sol-latest",
  "~anthropic/claude-opus-latest",
  "~anthropic/claude-sonnet-latest",
  "~anthropic/claude-haiku-latest",
  "~deepseek/deepseek-flash-latest",
  "qwen/qwen3-coder-next"
]

[models]
# Semantic model roles: specialized domain roles instead of generic difficulty tiers.
# If any role is omitted, it is deterministically inferred via a proximity fallback chain.
# At least one role must be defined.
scribe = "~anthropic/claude-haiku-latest"    # history compaction, git squash commit messages, diff summarization
advisor = "~google/gemini-flash-latest"      # interactive engineering dialogue, develop consultation
# The coder value is polymorphic. A bare model string or a { model, effort } table
# yields a one-rung ladder; an ordered array of such entries expresses an explicit
# Coder Ladder, where each rung pairs a model with an optional reasoning depth.
# Escalation can therefore first deepen reasoning on the same model and only then
# switch to a stronger or more specialized one:
#
coder = [
  "~deepseek/deepseek-flash-latest",
  { model = "~google/gemini-flash-latest", effort = "medium" }
]
architect = "~google/gemini-flash-latest"    # conceptual design, plan refinement, blocked-step replanning
reviewer = "~google/gemini-flash-latest"     # automated code review of active context files

# Automatically escalate the Coder along its ladder when verification healing stalls,
# when a patch retry budget is exceeded, or when a plan step must be re-prompted after
# protocol drift. Escalation advances one rung at a time within the Coder role and never
# switches to Architect, preserving the strict What vs How role isolation. A terminal
# <blocked> report short-circuits escalation entirely.
auto_level_up = true

# Optional per-role reasoning depth: "low", "medium", "high", or "xhigh".
# Effort stays orthogonal to model identity: the same model may be driven at a
# different depth depending on the role it plays. Omitted roles fall back to the
# provider default.
[models.effort]
# scribe = "low"        # cheap history compaction and commit message synthesis
# coder = "medium"      # balanced patch generation and verification healing
architect = "high"      # deep conceptual design and plan refinement
# advisor = "medium"    # interactive engineering dialogue
reviewer = "high"       # thorough automated code review

[develop]
# Retry budget for failed edit staging and for the plan step reprompt loop
# (corrective re-runs of a step turn that produced no verified edits and no terminal
# success tag).
max_retries = 5
# workflow = "git"   # edit workflow: "toolchain", "git", "naive" (default: "git")
# protocol = "xml"   # active edit protocol: "xml" (default: "xml")

[toolchain]
# check_command = ""  # custom project verification command (auto-detected by default)
# max_retries = 5     # maximum retry attempts for compiler/linter self-healing
# auto_heal = false   # automatically trigger verification healing loop on check failures

[git]
# upstream = "origin/master"  # base upstream branch for calculating diffs (auto-detected by default)

[history]
budget_tokens = 20000  # session history token budget before compaction is triggered (default: 20000)
# tail_turns = 10        # number of recent turns kept uncompressed in original form (default: 10)

[context]
# discovery_mode = "monotonic"  # context discovery strategy: "monotonic" (pure append-only growth, default), "incremental" (additive with explicit drops), or "snapshot" (full active working set declared each round)
max_discovery_rounds = 8  # maximum rounds for autonomous context discovery
max_files = 60  # maximum total files in context before stopping execution (default: 25)
repomap_token_budget = 40000  # token budget for the repository map (default: 4000)
pinned = [
    "Conventions.md",
    "Vision.md",
    "book/src/SUMMARY.md"
]
