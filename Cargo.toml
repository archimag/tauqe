[workspace]
members = [
    "crates/protocol",
    "crates/core",
    "crates/server",
    "crates/tui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
workbench-protocol = { path = "crates/protocol" }
workbench-core = { path = "crates/core" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
anyhow = "1.0"
thiserror = "1.0"
ratatui = "0.29"
crossterm = "0.28"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
toml = "0.8"
